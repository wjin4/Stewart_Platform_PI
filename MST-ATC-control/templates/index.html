<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dual Actuator Controller</title>
<style>
body{font:16px system-ui,sans-serif;background:#f4f6fa;color:#17243b;margin:0;padding:16px}main{max-width:1100px;margin:auto}h1{font-size:1.5rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}.card{background:white;border:1px solid #d8e0eb;border-radius:14px;padding:18px;box-shadow:0 3px 12px #16253c0b}label{display:block;font-size:.9rem;margin:10px 0 4px}input,select,button{font:inherit;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px}input,select{width:100%;background:white}button{cursor:pointer;background:#e7edf6;margin:5px 4px 5px 0}button.primary{background:#1458cf;color:white;border-color:#1458cf}button.danger{background:#ba2535;color:white;border-color:#ba2535}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row button{width:100%}.status{font-weight:600;margin:10px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101d31;color:#b7f7d0;border-radius:8px;padding:12px;height:220px;overflow:auto;font-size:12px}.muted{color:#64748b;font-size:.85rem}.error{color:#b42332;min-height:20px}
</style></head><body><main><h1>Dual USB Actuator Controller</h1><p class="muted">Each channel operates independently. Connect only on a trusted local network.</p><button onclick="refreshPorts()">Refresh USB devices</button><div class="grid" id="cards"></div></main>
<script>
const ids=['a','b'];let ports=[];
function card(id,name){return `<section class="card"><h2>${name}</h2><div class="status" id="status-${id}">Disconnected</div><label>USB serial port</label><select id="port-${id}"></select><label>Baud rate</label><select id="baud-${id}"><option selected>9600</option><option>19200</option><option>38400</option><option>57600</option><option>115200</option><option>230400</option><option>460800</option><option>921600</option></select><div class="row"><button onclick="act('${id}','connect')">Connect</button><button onclick="act('${id}','disconnect')">Disconnect</button></div><label>Command</label><input id="command-${id}" value="START"><label>Line ending</label><select id="ending-${id}"><option value="lf">LF (\\n)</option><option value="crlf">CRLF (\\r\\n)</option><option value="cr">CR (\\r)</option><option value="none" selected>None</option></select><label>Loop mode</label><select id="mode-${id}"><option value="count">Number of repetitions</option><option value="duration">Duration in seconds</option></select><label>Count / duration</label><input type="number" id="limit-${id}" min="1" value="100"><label>OK timeout (seconds)</label><input type="number" id="timeout-${id}" min="0.1" step="0.1" value="5"><div class="row"><button onclick="act('${id}','send')">Send once</button><button class="primary" onclick="act('${id}','start')">Start loop</button></div><button class="danger" onclick="act('${id}','stop')">Stop actuator (s)</button><div id="error-${id}" class="error"></div><strong>Serial log</strong><pre id="log-${id}"></pre></section>`}
document.getElementById('cards').innerHTML=card('a','Actuator A')+card('b','Actuator B');
const val=(id,key)=>document.getElementById(`${key}-${id}`).value;
async function api(url,options){const r=await fetch(url,options);const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
async function refreshPorts(){try{ports=await api('/api/ports');ids.forEach(id=>{const select=document.getElementById(`port-${id}`);const old=select.value;select.replaceChildren();ports.forEach(p=>{const opt=new Option(`${p.device} — ${p.description}`,p.device);select.add(opt)});if(ports.some(p=>p.device===old))select.value=old})}catch(e){alert(e.message)}}
async function act(id,action){const data={port:val(id,'port'),baud:val(id,'baud'),command:val(id,'command'),ending:val(id,'ending'),mode:val(id,'mode'),limit:val(id,'limit'),timeout:val(id,'timeout')};document.getElementById(`error-${id}`).textContent='';try{await api(`/api/${id}/${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});await poll()}catch(e){document.getElementById(`error-${id}`).textContent=e.message}}
async function poll(){try{const data=await api('/api/status');ids.forEach(id=>{const d=data[id];document.getElementById(`status-${id}`).textContent=`${d.connected?'Connected':'Disconnected'} | ${d.running?'RUNNING':'Idle'} | Completed: ${d.completed}`;document.getElementById(`error-${id}`).textContent=d.error||'';document.getElementById(`log-${id}`).textContent=d.logs.join('\n');if(d.port&&ports.some(p=>p.device===d.port))document.getElementById(`port-${id}`).value=d.port})}catch(e){console.error(e)}}
refreshPorts().then(poll);setInterval(poll,1000);
</script></body></html>
